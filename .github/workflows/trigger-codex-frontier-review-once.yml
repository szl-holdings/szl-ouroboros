# SPDX-License-Identifier: Apache-2.0
name: Trigger Codex frontier review once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-codex-frontier-review-once.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Dispatch the protected-main Codex review controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run codex-frontier-review.yml \
            --ref main \
            -f force=true \
            -f reason='initial source-bound frontier review'

      - name: Remove this one-shot trigger through a review branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cleanup
          cd cleanup
          branch="chore/remove-codex-trigger-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git rm .github/workflows/trigger-codex-frontier-review-once.yml
          git commit -s -m "chore(codex): remove completed initial dispatch trigger"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(codex): remove completed initial dispatch trigger" \
            --body "The protected-main Codex frontier controller was dispatched. Remove the one-shot trigger; no runtime or authority change.\n\nSigned-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
