# SPDX-License-Identifier: Apache-2.0
name: Keyless Khipu branch proof

"on":
  push:
    branches:
      - feat/keyless-khipu-frontier-review
    paths:
      - ".github/workflows/keyless-khipu-branch-proof.yml"

permissions:
  contents: read

concurrency:
  group: keyless-khipu-branch-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/torch-ext
      HF_HUB_DISABLE_TELEMETRY: "1"
      SOURCE_RECEIPT: inputs/source-receipt.json
      CANDIDATES: inputs/frontier-candidates.public.jsonl
      FRONTIER_STATE: inputs/frontier-state.v1.json
      REVIEW_OUTPUT: outputs/codex-review.json
      OPEN_EXECUTION_RECEIPT: outputs/open-reviewer-execution.json
      LOOP_RECEIPT: outputs/ouroboros-frontier-loop-receipt.json
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache exact public model and wheel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/szl-open-reviewer
          key: khipu-open-reviewer-v2-13c1a1993063e1dff92f7413ccf48eaca6d48efc8801ae9af35961ae3396623a-d172f3d3c8cdd194c3c47c71cb077ed6e61354a2d0f939ceeac0c8fd29999596

      - name: Install verified keyless runtime
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(
            python scripts/fetch_verified_llama_cpp_wheel.py \
              --directory "$HOME/.cache/szl-open-reviewer/wheels"
          )"
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "$wheel_path" "huggingface_hub==1.29.0"
          python - <<'PY'
          import llama_cpp
          import huggingface_hub
          print("verified open reviewer runtime", llama_cpp.__version__, huggingface_hub.__version__)
          PY

      - name: Prepare exact public Second Brain input
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs outputs
          python scripts/prepare_codex_frontier_review.py --output inputs

      - name: Run exact public Khipu GGUF without a provider key
        id: reviewer
        shell: bash
        run: |
          set -euo pipefail
          date +%s%3N > /tmp/wall-start-ms
          python scripts/run_open_frontier_review.py \
            --state "$FRONTIER_STATE" \
            --candidates "$CANDIDATES" \
            --source-receipt "$SOURCE_RECEIPT" \
            --schema schemas/codex-frontier-review.schema.json \
            --output "$REVIEW_OUTPUT" \
            --execution-receipt "$OPEN_EXECUTION_RECEIPT" \
            --provider local-gguf \
            --candidate-limit 12 \
            --context-tokens 8192 \
            --max-tokens 900 \
            --seed 749
          date +%s%3N > /tmp/wall-end-ms

      - name: Independently validate and close the loop
        shell: bash
        run: |
          set -euo pipefail
          start="$(cat /tmp/wall-start-ms)"
          end="$(cat /tmp/wall-end-ms)"
          elapsed="$((end - start))"
          python scripts/finalize_codex_frontier_review.py \
            --source-receipt "$SOURCE_RECEIPT" \
            --candidates "$CANDIDATES" \
            --review "$REVIEW_OUTPUT" \
            --output "$LOOP_RECEIPT" \
            --codex-attempted true \
            --codex-outcome success \
            --model "SZLHOLDINGS/SZL-Khipu-1.5B-GGUF@67d60ec577730747055491640cfb91fc4a4b5d25:SZL-Khipu-1.5B-Q4_K_M.gguf" \
            --latency-ms "$elapsed" \
            --wall-ms "$elapsed"
          state="$(python -c 'import json,os; print(json.load(open(os.environ["LOOP_RECEIPT"]))["state"])')"
          case "$state" in
            REVIEW_PROPOSED|NO_ACTION_RECOMMENDED|BLOCKED) ;;
            *) echo "::error::invalid keyless terminal state: $state"; exit 1 ;;
          esac
          test -s "$OPEN_EXECUTION_RECEIPT"
          test -s "$LOOP_RECEIPT"

      - name: Retain exact keyless proof receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keyless-khipu-branch-proof-${{ github.run_id }}
          path: |
            inputs/source-receipt.json
            outputs/codex-review.json
            outputs/open-reviewer-execution.json
            outputs/ouroboros-frontier-loop-receipt.json
          if-no-files-found: error
          retention-days: 90
